# Firebase App Hosting configuration
# Secrets live in Cloud Secret Manager (grant access with:
#   firebase apphosting:secrets:grantaccess <NAME> --backend <BACKEND>)
# FIREBASE_WEBAPP_CONFIG is injected automatically by App Hosting for the SERVER (lib/firebase.ts
# consumes it) and firebase-admin uses Application Default Credentials, so neither
# needs an entry here.

runConfig:
  memoryMiB: 1024
  maxInstances: 4

env:
  # Firebase Web SDK config for the BROWSER. Next.js only inlines NEXT_PUBLIC_*
  # variables into client bundles at build time; FIREBASE_WEBAPP_CONFIG (injected
  # by App Hosting) is not visible in the browser, so without these the client
  # fell back to placeholder config and Auth/Firestore never worked in
  # production (decision #99). These values are public by design (they ship to
  # every browser); app "Iron Lion Scouting" 1:12888076401:web:e255f77ba0c1a0ebb4ebd0.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDBh78SZ2ctsG-yDQj3fTPqIGzu_e0dAZA
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ironlion-scouting.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ironlion-scouting
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: ironlion-scouting.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "12888076401"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:12888076401:web:e255f77ba0c1a0ebb4ebd0
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-L5ZWCQ9BSE
    availability: [BUILD, RUNTIME]
  - variable: FTC_API_USERNAME
    secret: FTC_API_USERNAME
  - variable: FTC_API_KEY
    secret: FTC_API_KEY
  - variable: GOOGLE_GENERATIVE_AI_API_KEY
    secret: GOOGLE_GENERATIVE_AI_API_KEY
  # Superadmin allow-list (comma-separated emails). Not a secret — it's the
  # access-control list for /admin; the root of trust stays in env by design.
  - variable: SUPERADMIN_EMAILS
    value: hector.hturrubiates@gmail.com,hectorturrubiates@horno3.org
